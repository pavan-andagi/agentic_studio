# ---- LLM used by the Trend, Planner, Script and Editing agents ----
llm:
  model: claude-sonnet-5-5        # any Claude model string works here
  max_tokens: 32000
  web_search_max_uses: 8          # Trend agent only

# ---- Master agent: turns your feedback into proceed / go-back decisions ----
master:
  enabled: true
  confirm_decisions: false   # true = confirm each Master decision first

# ---- ComfyUI (on the pod, or via SSH tunnel to localhost:8188) ----
comfy:
  url: http://127.0.0.1:8188
  poll_seconds: 5
  timeout_minutes: 60             # per job
  workflows:                      # API-format exports (see workflows/README.md)
    image: workflows/z_image_t2i.json
    i2v: workflows/ltx_i2v.json
    flf2v: workflows/ltx_flf2v.json
    upscale: workflows/upscale_4k.json   # optional (RIFE + Real-ESRGAN)
    music: workflows/ace_step_music.json # ACE-Step 1.5 text-to-music
    ambience: workflows/ltx_t2a.json     # LTX-2.5 text-to-audio (audio-only)
    edit: workflows/qwen_edit_2511.json  # Qwen Image Edit 2511: keyframes with cast references
    animate: workflows/wan_animate.json   # Wan 2.2 Animate: character swap in a video

# ---- Defaults the Planner starts from (it can change them, you approve) ----
defaults:
  aspect: "9:16"                  # 9:16 Reels/Shorts, 16:9 YouTube
  image_size: [1056, 1920]        # same 9:16 shape as the video, 1.5x larger
  # NOTE: image_size applies to the plain text-to-image path only.
  # The Qwen edit workflow has no width/height node - it scales the
  # first reference picture to the nearest resolution the model
  # supports (about 1 megapixel, e.g. 752x1392) and encodes that as
  # the latent. That is still larger than video_size, so it is not a
  # problem; forcing 2 MP through that model would hurt, not help.
  video_size: [480, 864]         # LTX needs multiples of 32 (half-res pass too)
  transition: dissolve            # at hard cuts: none | dissolve | fadeblack
  transition_seconds: 0.5         # chained shots always join seamlessly
  fps: 16
  max_clip_seconds: 5

  # Character swap: Video. 'segments' cuts the clip where it changes,
  # gives each piece a reference made from its own footage and
  # generates piece by piece; 'single' is the old one-pass behaviour,
  # kept for comparison.
  swap_mode: segments
  swap_sensitivity: 1.0      # higher cuts more often
  swap_max_seconds: 4        # no chunk longer than this, however still
  swap_overlap: 8            # frames dissolved at each join
  images_per_keyframe: 2          # Z-Image variants to choose from
  upscale_4k: false               # true = run the upscale workflow on approved clips

# ---- Cast stage (4): one reference picture per character ----
cast:
  enabled: true
  options: 3
  max_refs_per_keyframe: 3     # 1-3
  multipass: false             # true = old behaviour, extra passes for 4+
  turnaround: true              # character refs = front + back sheet

# ---- Finish stage (7): the look, imposed after the clips are generated ----
# Deterministic: no model, no GPU, re-runs in seconds. That is the point -
# a look you can iterate on for free is a look you will actually iterate on.
# It is also how several styles become reachable at all. Pixel art, Benday
# halftone, risograph and VHS are not things to ask a diffusion model for;
# it works in continuous space and smears every one of them. Generate a
# clean plate in a style the model is good at, impose the look here.
finish:
  enabled: true
  crf: 17                       # 17 is near-visually-lossless; 23 is smaller
  # filters:                    # uncomment to override the style profile
  #   - {name: grade, contrast: 1.1, saturation: 0.95}

  # Presets, for reference - these now live on the style profiles above.
  #
  # pixel art  (generate flat illustration, NOT pixel art, then quantise)
  #   - {name: quantise, colours: 24}
  #   - {name: pixelate, block: 6}
  #
  # comic / Benday halftone
  #   - {name: halftone, dot: 4, angle: 15}          # colour: true for CMY
  #
  # risograph print
  #   - {name: riso, colours: 4, offset: 2, grain: 10}
  #
  # 1980s VHS
  #   - {name: vhs, chroma: 3, scanline: 0.12, noise: 6}
  #   - {name: grade, saturation: 1.1, contrast: 0.95}
  #
  # film-ish polish
  #   - {name: grade, contrast: 1.1, saturation: 0.95}
  #   - {name: bloom, threshold: 0.75, amount: 0.3}
  #   - {name: grain, amount: 5}

# ---- Style profiles ----
# A style used to be a sentence handed to the image model, and nothing
# after that point knew what the sentence implied. A profile carries the
# three failure axes as data, so one edit here changes mode selection,
# shot length, text routing and post-processing together.
#
#   reveal  does the style need content to accumulate over time? The model
#           has no memory of what it already drew, so it morphs instead of
#           adding. reveal >= 2 forces flf2v and injects start_hint.
#   glyph   does it need readable letters or numbers? glyph >= 1 bans text
#           from the plate and routes it to an overlay.
#   lock    does it need frame-exact precision - a pixel grid, repeated
#           linework, a face that stays the same face? lock >= 2 caps
#           every shot at 3 seconds, because identity drift is a function
#           of duration.
#
# Pick one with:  python -m studio.main new <name> --brief '...' --style cut_paper
styles:
  default: cut_paper

  cut_paper:
    line: "Layered cut-paper diorama animation. Landscapes built from torn
           and cut coloured paper in distinct stacked layers, soft shadows
           falling between the layers, visible paper grain and fibre edges.
           Warm limited palette of ochre, terracotta, indigo, sage and
           cream. Slow parallax camera moves."
    axes: {reveal: 0, glyph: 0, lock: 0}
    max_shot_s: 6
    prefer_mode: i2v
    filters:
      - {name: grade, contrast: 1.08, saturation: 0.96, tint: [1.03, 1.0, 0.96]}

  silhouette:
    line: "Shadow-puppet animation. Flat black cut-out figures and
           landscapes against a warm lit backdrop, hard clean edges, no
           interior detail, depth shown only by overlapping layers."
    axes: {reveal: 0, glyph: 0, lock: 0}
    max_shot_s: 6
    filters:
      - {name: grade, contrast: 1.15, saturation: 0.9}

  linocut:
    line: "Linocut print. Bold carved shapes, visible gouge marks, two or
           three ink colours on off-white paper, heavy black outlines, no
           gradients."
    axes: {reveal: 0, glyph: 0, lock: 0}
    max_shot_s: 6
    filters:
      - {name: grade, contrast: 1.2, saturation: 0.85}

  pixel_art:
    # The plate is NOT generated as pixel art. A diffusion model works in
    # continuous space and smears the grid that is the whole style, so the
    # plate is clean flat illustration and the grid is imposed afterwards.
    line: "Flat limited-palette illustration, bold simple shapes, hard
           edges, no gradients, no texture, no fine detail."
    axes: {reveal: 0, glyph: 1, lock: 2}
    filters:
      - {name: quantise, colours: 24}
      - {name: pixelate, block: 6}

  comic_halftone:
    line: "Bold black ink outlines, flat colour fills, strong shadow
           shapes, high contrast comic panel art."
    axes: {reveal: 0, glyph: 1, lock: 1}
    max_shot_s: 5
    filters:
      - {name: halftone, dot: 4, angle: 15}

  riso_print:
    line: "Simple graphic shapes, flat colour, bold composition, minimal
           detail, poster-like."
    axes: {reveal: 0, glyph: 1, lock: 1}
    filters:
      - {name: riso, colours: 4, offset: 2, grain: 10}

  retro_vhs:
    line: "1980s home video look, soft focus, warm practical lighting,
           slightly washed colour."
    axes: {reveal: 0, glyph: 2, lock: 1}
    max_shot_s: 4
    filters:
      - {name: vhs, chroma: 3, scanline: 0.12, noise: 6}
      - {name: grade, saturation: 1.1, contrast: 0.95}

  whiteboard:
    line: "Whiteboard scribe drawing. Flat white background, confident
           black marker line drawings, one warm orange accent, no shading."
    axes: {reveal: 2, glyph: 1, lock: 0}
    max_shot_s: 5
    start_hint: "a clean white board, almost empty, with only the faintest
                 beginning of the drawing in the top left"

# ---- Render stage (8): text and graphics, drawn in code ----
# Overlays are composited over the finished clips, never generated. A
# diffusion model garbles letters, and garbled text is the most visible
# tell in an AI video - so the Script agent puts anything that must be
# read into a shot's overlays list, and this stage draws it.
# Runs after Finish, so the look is already on the plate and the type
# stays crisp on top of it.
render:
  enabled: true
  crf: 17
  fade: 0.25                    # seconds, in and out of every overlay
  # font: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

# ---- Audio stage (9): voice-over, music, ambience, final mix ----
audio:
  enabled: true                   # false = no sound stage at all
  keep_clip_audio: false          # LTX's own clip sound (usually noise)
  clip_audio_db: -12              # only used when keep_clip_audio: true
  loudness_lufs: -14              # YouTube / Instagram loudness
  duck_music: true                # music gets quieter under the voice
  voiceover:
    enabled: true
    # A Kokoro voice id, or "ask" to hear the candidates below reading
    # this video's opening line and pick one at the gate.
    voice: ask
    voice_options:
      - bm_fable                  # British male, storyteller, warm
      - am_michael                # American male, professional, grounded
      - af_river                  # American female, flowing, calm
      - bf_emma                   # British female, sophisticated RP
    # sample_text: null           # defaults to the first narration line
    speed: 1.0
    max_words_per_second: 2.5
    lead_in: 0.3                  # seconds after a shot starts
    device: cpu                   # Kokoro is tiny; keeps the GPU for ComfyUI
  music:
    enabled: true
    options: 2                    # versions to choose from
    level_db: -16                 # relative to the voice
  ambience:
    enabled: true
    options: 2
    level_db: -20
    max_seconds: 20               # generated once, looped with crossfades

# ---- GPU cost tracking ----
# A sampler thread writes projects/<name>/gpu.csv for the life of a run,
# and the dashboard's Cost tab turns it into busy/idle seconds, a
# per-stage breakdown and a cost per second of finished video.
# Idle time is the GPU waiting on a human at a gate. It is the number
# that gets worse with more users, not better, so it is worth watching.
gpu:
  enabled: true
  every_seconds: 5
  hourly_rate: 0          # your pod's $/hour; 0 hides the money column

projects_dir: projects
