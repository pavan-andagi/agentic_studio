<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic AI video studio</title>
<style>
:root{--bg:#141413;--panel:#1c1b19;--panel2:#242320;--line:#3a3936;--tx:#ecebe4;--mut:#a3a199;--dim:#77756e;
--ok:#1D9E75;--okbg:#10302A;--okt:#9FE1CB;--ag:#7F77DD;--agbg:#221F3A;--agt:#CECBF6;--am:#EF9F27;--ambg:#3A2A10;--amt:#FAC775;--mx:#D85A30;--mxbg:#3A1C10;--mxt:#F5C4B3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
select,button,textarea{font:inherit;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--mut)}
.chip{padding:3px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line)}
.chip.active{background:var(--agbg);border-color:var(--ag);color:var(--agt)}.chip.review{background:var(--ambg);border-color:var(--am);color:var(--amt)}
.chip.done{background:var(--okbg);border-color:var(--ok);color:var(--okt)}.chip.stopped{background:var(--mxbg);border-color:var(--mx);color:var(--mxt)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:18px 20px;align-items:start}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
svg{width:100%;height:auto;display:block}
.node{cursor:pointer}.node rect{stroke-width:1.5}
.node.done rect{fill:var(--okbg);stroke:var(--ok)}.node.active rect{fill:var(--agbg);stroke:var(--ag);animation:pulse 1.6s infinite}
.node.review rect{fill:var(--ambg);stroke:var(--am);animation:pulse 1.2s infinite}.node.pending rect{fill:#1f1e1c;stroke:#444441}
.node.master rect{fill:var(--mxbg);stroke:var(--mx)}.node.sel rect{stroke:#fff;stroke-width:3}
.node .t{font-size:15px;font-weight:600;fill:var(--tx)}.node .s{font-size:12px;fill:var(--mut)}
.node.done .t{fill:var(--okt)}.node.active .t{fill:var(--agt)}.node.review .t{fill:var(--amt)}.node.master .t{fill:var(--mxt)}.node.master .s{fill:var(--mxt)}
.arrow{fill:none;stroke:#888780;stroke-width:2}.back{fill:none;stroke:var(--mx);stroke-width:2;stroke-dasharray:6 5;opacity:.3}
.back.hot{opacity:1;animation:dash 1s linear infinite}.badge{font-size:11px;fill:var(--mxt)}
@keyframes pulse{50%{stroke-width:3.5}}@keyframes dash{to{stroke-dashoffset:-22}}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:var(--panel2)}
.card.amber{border-color:var(--am);background:var(--ambg)}.ct{font-weight:600;margin-bottom:6px}
.sum{white-space:pre-wrap;max-height:230px;overflow:auto;background:#00000033;border-radius:8px;padding:8px;font-size:13px}
.hint{color:var(--mut);font-size:12px;margin-top:6px;white-space:pre-wrap}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.quick button.ok{background:var(--okbg);border-color:var(--ok);color:var(--okt)}
textarea{width:100%;min-height:62px;resize:vertical}.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row2 button.go{background:var(--agbg);border-color:var(--ag);color:var(--agt)}
img.pv,video.pv{max-width:100%;max-height:300px;border-radius:8px;margin-top:8px;display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:var(--agbg);border-color:var(--ag);color:var(--agt)}
h2{margin:0;font-size:17px}h3{margin:14px 0 6px;font-size:14px;color:var(--mut);font-weight:600}
.pill{display:inline-block;padding:0 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--mut);margin-left:6px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--panel2)}.item.chosen{border-color:var(--ok)}
.item p{margin:4px 0}.m{color:var(--mut);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
details{margin:4px 0}summary{cursor:pointer;color:var(--agt)}pre{white-space:pre-wrap;margin:4px 0;font-size:12px;color:var(--mut);font-family:ui-monospace,Menlo,Consolas,monospace}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.thumbs img{height:130px;border-radius:6px;border:1px solid var(--line)}.thumbs img.big{height:200px;border-color:var(--ok)}
.ev{display:grid;grid-template-columns:62px 62px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.tag{font-size:11px;border-radius:999px;padding:0 8px;border:1px solid var(--line);color:var(--mut);height:20px;white-space:nowrap}
.tag.master_decision,.tag.rewind{border-color:var(--mx);color:var(--mxt)}.tag.approved,.tag.done{border-color:var(--ok);color:var(--okt)}
.tag.human_feedback{border-color:var(--am);color:var(--amt)}.tag.output{border-color:var(--ag);color:var(--agt)}
.con{max-height:520px;overflow:auto;background:#0d0d0c;border-radius:8px;padding:10px;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;color:#cfcdc4}
.empty{color:var(--dim);padding:16px 4px}
.vsw{display:flex;gap:0}.vsw button{border-radius:0}.vsw button:first-child{border-radius:8px 0 0 8px}.vsw button:last-child{border-radius:0 8px 8px 0}.vsw button.on{background:var(--agbg);border-color:var(--ag);color:var(--agt)}
#commview{padding:18px 20px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}.stat b{font-size:20px;display:block}.stat span{color:var(--mut);font-size:12px}
.ctrl{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mut)}.ctrl label{display:flex;gap:6px;align-items:center}
.cscroll{max-height:62vh;overflow:auto;border-top:1px solid var(--line);margin-top:6px}
.msg{cursor:pointer}.msg .hit{fill:transparent}.msg:hover .hit{fill:#ffffff10}.msg.sel .hit{fill:#ffffff1c}
.mt{font-size:12px;fill:#e2e0d8;paint-order:stroke;stroke:#1c1b19;stroke-width:4px;stroke-linejoin:round}.tm{font-size:10px;fill:var(--dim)}
.bandl{font-size:10px;fill:var(--dim);letter-spacing:1.5px;text-transform:uppercase}.ll{stroke:#3a3936;stroke-width:1;stroke-dasharray:3 5}
.lane rect{stroke-width:1.5}.lane text{font-size:12px;fill:var(--tx)}.lane .sub{font-size:10px;fill:var(--mut)}.lane.act rect{animation:pulse 1.4s infinite}
.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button.mic{background:var(--agbg);border-color:var(--ag);color:var(--agt)}
button.mic.rec{background:var(--mxbg);border-color:var(--mx);color:var(--mxt);animation:blink 1s infinite}
button.mic:disabled,button.spk:disabled{opacity:.45;cursor:default}
.vstat{font-size:12px;color:var(--amt)}.vopt{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center}
@keyframes blink{50%{opacity:.6}}
</style></head><body>
<header><h1>Agentic AI video studio</h1><select id="proj" title="Project"></select><span class="vsw"><button data-view="flow" id="vFlow" class="on">Flow</button><button data-view="comm" id="vComm">Communication</button></span><span id="chip" class="chip">loading…</span><span id="meta" style="color:var(--dim);font-size:12px"></span><label class="vopt" title="Read each new question aloud when it appears"><input type="checkbox" id="vAuto"> read new questions aloud</label></header>
<main id="mainview">
 <section><div class="panel"><div id="flow"></div></div><div id="review"></div></section>
 <section class="panel"><div id="head"></div><div id="tabs" class="tabs"></div><div id="body"></div></section>
</main>
<div id="commview" style="display:none">
 <div id="cstats" class="stats"></div>
 <div class="panel">
  <div class="ctrl"><label><input type="checkbox" id="fLlm" checked> Claude API calls</label><label><input type="checkbox" id="fComfy" checked> ComfyUI jobs</label>
   <label>Involving <select id="fLane"><option value="all">everyone</option></select></label><label><input type="checkbox" id="fAll"> show all (not just the latest 150)</label><span id="cinfo"></span></div>
  <div id="chead"></div><div id="cscroll" class="cscroll"><div id="cbody"></div></div>
 </div>
 <div id="cdetail"></div>
</div>
<script>
var KEY=(typeof location!=='undefined'&&new URLSearchParams(location.search).get('key'))||null;
function q(p){return KEY?p+(p.indexOf('?')>=0?'&':'?')+'key='+encodeURIComponent(KEY):p}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fileUrl(proj,rel){return q('/files/'+encodeURIComponent(proj)+'/'+rel.split('/').map(encodeURIComponent).join('/'))}
function cut(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n-1)+'…':s}
function wrap(text,n,max){var w=String(text||'').split(/\s+/),lines=[],cur='';w.forEach(function(x){if((cur+' '+x).trim().length>n){lines.push(cur);cur=x}else cur=(cur+' '+x).trim()});if(cur)lines.push(cur);if(lines.length>max){lines=lines.slice(0,max);lines[max-1]=cut(lines[max-1]+'…',n)}return lines}
function ago(s){s=Math.max(0,Math.round(s));return s<60?s+'s':s<3600?Math.floor(s/60)+'m '+(s%60)+'s':Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'}
function clock(t){var d=new Date(t*1000);return d.toTimeString().slice(0,8)}
var ST=[
 {id:'trend',n:'1 Trend identifier',s:'Claude + web search',desc:'Finds what is trending now and ranks ideas for your channel.'},
 {id:'plan',n:'2 Project planner',s:'Style, characters, beats',desc:'Writes the production plan and locks the look and characters.'},
 {id:'script',n:'3 Script and shots',s:'Prompts for every shot',desc:'Turns the beats into a shot list with ready-to-run prompts.'},
 {id:'cast',n:'4 Cast',s:'One picture per character',desc:'Makes a reference picture of every character; you pick the face and outfit used all video long.'},
 {id:'images',n:'5 Image creation',s:'Z-Image / Qwen Edit',desc:'Generates keyframes (with the cast pictures for shots with characters); you pick the best option for each.'},
 {id:'clips',n:'6 Clips and editing',s:'LTX-2.5, 4K, assembly',desc:'Animates the keyframes, checks the clips, joins the final video.'},
 {id:'audio',n:'7 Audio',s:'Voice, music, ambience',desc:'Narration (Kokoro), music (ACE-Step) and ambience (LTX audio), mixed under the video.'},
 {id:'final',n:'Final video',s:'Edit notes, captions',desc:'The assembled video, editing suggestions and captions.'}];
function stageName(id){var s=ST.filter(function(x){return x.id===id})[0];return s?s.n:(id||'')}
function needed(d){var sc=d.files.script,out=[];if(!sc||!sc.shots)return out;sc.shots.forEach(function(s){if(s.start_from==='new_keyframe'&&s.start_image_prompt)out.push({key:s.id+'_start',shot:s});if(s.mode==='flf2v'&&s.end_image_prompt)out.push({key:s.id+'_end',shot:s})});return out}
function stageStatus(d,id){var ap=(d.state.approved||{}),c=d.state.current||{};
 if(id==='final')return ap.audio?'done':'pending';
 if(ap[id])return 'done';
 if(c.stage===id){if(c.status==='waiting')return 'review';if(c.status==='working'||c.status==='master')return 'active'}
 return 'pending'}
function stageInfo(d,id){var f=d.files,sc=f.script;
 if(id==='trend')return f.chosen?cut(f.chosen.title,34):(f.trends?f.trends.trends.length+' ideas found':'Claude + web search');
 if(id==='plan')return f.plan?cut(f.plan.title,34):'Style, characters, beats';
 if(id==='script')return sc&&sc.shots?sc.shots.length+' shots, about '+sc.shots.reduce(function(a,s){return a+(s.duration||0)},0)+' s':'Prompts for every shot';
 if(id==='images'){var n=needed(d);return n.length?Object.keys(d.keyframes).length+' of '+n.length+' keyframes picked':'Z-Image Turbo'}
 if(id==='clips')return sc&&sc.shots?Object.keys(d.clips).length+' of '+sc.shots.length+' clips approved':'LTX-2.5, 4K, assembly';
 if(id==='cast'){var cn=Object.keys(d.cast||{}),pc=(f.plan&&f.plan.characters)||[];return pc.length?cn.length+' of '+pc.length+' characters cast':'One picture per character'}
 if(id==='audio'){var a=f.audio;return a?(a.layers.length?a.layers.join(', '):'no layers')+' mixed':'Voice, music, ambience'}
 return d.final.length?'Ready to watch':'Edit notes, captions'}
function lastRewind(d){var r=d.events.filter(function(e){return e.kind==='rewind'}).pop();
 if(!r)return null;if((d.state.approved||{})[r.stage])return null;return r}
function redoCount(d,id){return d.events.filter(function(e){return e.kind==='rewind'&&e.stage===id}).length}
function masterText(d){var c=d.state.current||{};if(c.status==='master')return 'Analysing your feedback…';
 var m=d.events.filter(function(e){return e.kind==='master_decision'}).pop();return m?m.text:'Acts only when you give feedback'}
function headline(d){var c=d.state.current||{},p=d.pending;
 if(c.status==='done')return{k:'done',t:'Finished: all stages approved'};
 if(p)return{k:'review',t:'Waiting for you: '+p.title};
 if(!d.run.alive)return{k:'stopped',t:'Studio process is not running'};
 if(c.status==='master')return{k:'active',t:'Master agent is analysing your feedback'};
 if(c.status==='working')return{k:'active',t:stageName(c.stage)+': '+(c.detail||'working')};
 return{k:'idle',t:'Idle'}}
function renderFlow(d,sel){
 var NS=ST.filter(function(s){return s.id!=='final'}).length,Y=function(i){return 60+i*112},H=72,out=[];
 out.push('<svg viewBox="0 0 900 '+(Y(NS)+90)+'" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6"/></marker></defs>');
 var rw=lastRewind(d),ti=rw?ST.map(function(s){return s.id}).indexOf(rw.stage):-1;
 out.push('<path class="back" d="M755 60V24H22V'+(Y(NS-1)+36)+'"/>');
 if(rw&&ti>=0)out.push('<path class="back hot" d="M22 24V'+(Y(ti)+36)+'H46" marker-end="url(#ahm)"/>');
 for(var i=0;i<NS;i++){out.push('<path class="back" d="M22 '+(Y(i)+36)+'H46" marker-end="url(#ahm)"/>')}
 for(var i=0;i<NS;i++){var y=Y(i),ny=Y(i+1);
  out.push('<path class="arrow" d="M320 '+(y+36)+'H378" marker-end="url(#ah)"/><path class="arrow" d="M580 '+(y+36)+'H648" marker-end="url(#ah)"/>');
  out.push('<path class="arrow" d="M480 '+(y+H)+'V'+(y+H+20)+'H185V'+(ny-3)+'" marker-end="url(#ah)"/><text class="s" style="font-size:11px;fill:#77756e" x="330" y="'+(y+H+15)+'" text-anchor="middle">'+['1_trend_chosen.json','2_plan.json','3_script.json','cast/','keyframes/','clips/ and final/','audio/ and final/'][i]+'</text>')}
 ST.slice(0,NS).forEach(function(s,i){var y=Y(i),st=stageStatus(d,s.id),c=d.state.current||{};
  var sub=(st==='active'&&c.stage===s.id&&c.detail)?c.detail:stageInfo(d,s.id),rc=redoCount(d,s.id);
  out.push('<g class="node '+st+(sel===s.id?' sel':'')+'" data-stage="'+s.id+'"><rect x="50" y="'+y+'" width="270" height="'+H+'" rx="12"/><text class="t" x="68" y="'+(y+30)+'">'+esc(s.n)+'</text><text class="s" x="68" y="'+(y+52)+'">'+esc(cut(sub,38))+'</text>'+(rc?'<text class="badge" x="296" y="'+(y+20)+'" text-anchor="end">redone x'+rc+'</text>':'')+'</g>');
  var rs=st==='review'?'review':(stageStatus(d,s.id)==='done'?'done':'pending'),rt=st==='review'?'Waiting for you':(rs==='done'?'Approved':'Not reached yet');
  out.push('<g class="node '+rs+'" data-stage="'+s.id+'" data-tab="feedback"><rect x="380" y="'+y+'" width="200" height="'+H+'" rx="12"/><text class="t" x="398" y="'+(y+30)+'">You review</text><text class="s" x="398" y="'+(y+52)+'">'+esc(rt)+'</text></g>')});
 var mh=Y(NS-1)+H-60,ml=wrap(masterText(d),26,6),lm=d.events.filter(function(e){return e.kind==='master_decision'}).pop();
 out.push('<g class="node master'+((d.state.current||{}).status==='master'?' active':'')+'" data-stage="'+(lm?lm.stage:'')+'" data-tab="master"><rect x="650" y="60" width="210" height="'+mh+'" rx="12"/><text class="t" x="668" y="92">Master agent</text><text class="s" x="668" y="116">Last decision</text>'+ml.map(function(l,i){return'<text class="s" x="668" y="'+(142+i*20)+'">'+esc(l)+'</text>'}).join('')+'</g>');
 var fs=stageStatus(d,'final');
 out.push('<g class="node '+fs+(sel==='final'?' sel':'')+'" data-stage="final"><rect x="50" y="'+Y(NS)+'" width="270" height="64" rx="12"/><text class="t" x="68" y="'+(Y(NS)+28)+'">Final video</text><text class="s" x="68" y="'+(Y(NS)+48)+'">'+esc(stageInfo(d,'final'))+'</text></g></svg>');
 return out.join('')}
function renderHead(d,sel){var s=ST.filter(function(x){return x.id===sel})[0]||ST[0],st=stageStatus(d,s.id);
 var lab={done:'Approved',active:'Working',review:'Waiting for your review',pending:'Not reached yet'}[st];
 return'<h2>'+esc(s.n)+' <span class="pill">'+lab+'</span></h2><div class="m">'+esc(s.desc)+'</div>'}
function renderTabs(tab){return[['output','Output'],['master','Master decision'],['feedback','Feedback'],['timeline','Timeline'],['console','Console']].map(function(t){return'<button data-tab="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'<button data-follow="1" title="Follow the live stage">Follow live</button>'}
function previewHtml(d,rel){if(!rel)return'';var u=fileUrl(d.name,rel),x=rel.toLowerCase();
 if(/\.(png|jpg|jpeg|webp)$/.test(x))return'<a href="'+u+'" target="_blank"><img class="pv" src="'+u+'"></a>';
 if(/\.(mp4|webm|mov)$/.test(x))return'<video class="pv" controls preload="metadata" src="'+u+'"></video>';return''}
function renderReview(d){var p=d.pending,h=headline(d);
 if(!p){var extra=h.k==='stopped'?'<div class="hint">Resume it with:  python -m studio.main resume '+esc(d.name)+'</div>':'<div class="hint">When a stage is ready, your review appears here. You can also answer in the terminal.</div>';
  return'<div class="card"><div class="ct">'+esc(h.t)+'</div>'+extra+'</div>'}
 var o=p.options||'',m=o.match(/1-(\d+)/),n=m?+m[1]:0,retake=/\[t\]|\bt for\b|\bt = /.test(o),skip=/\bs = /.test(o),btn=[];
 if(p.kind!=='text'&&n===0)btn.push('<button class="ok" data-ans="a">Approve</button>');
 for(var i=1;i<=n;i++)btn.push('<button class="ok" data-ans="'+i+'">Pick #'+i+'</button>');
 if(retake)btn.push('<button data-ans="t">New options / retake (t)</button>');
 if(skip)btn.push('<button data-ans="s">Skip this layer (s)</button>');
 if(/\bx = /.test(o))btn.push('<button data-ans="x">Redo this stage with my feedback (x)</button>');
 var label=p.kind==='text'?'Send':(p.kind==='gate'?'Send as feedback (rewrite)':'Send feedback');
 return'<div class="card amber"><div class="ct">Waiting for you: '+esc(p.title)+'</div><div class="sum">'+esc(p.summary)+'</div>'+previewHtml(d,p.artifact)+
  '<div class="quick">'+btn.join('')+'</div><textarea id="ans" placeholder="Type your feedback here (or a file path for your own image or clip)"></textarea>'+
  '<div class="row2"><button class="go" data-send="feedback">'+label+'</button>'+(p.kind==='text'?'':'<button data-send="raw">Send exactly as typed</button>')+'</div>'+voiceBar()+'<div class="hint">'+esc(o)+'</div></div>'}
function empty(t){return'<div class="empty">'+esc(t)+'</div>'}
function pills(a){return a.filter(Boolean).map(function(x){return'<span class="pill">'+esc(x)+'</span>'}).join('')}
function outTrend(d){var t=d.files.trends;if(!t)return empty('The trend agent has not produced ideas yet.');var ch=d.files.chosen&&d.files.chosen.title;
 return t.trends.map(function(x,i){return'<div class="item'+(x.title===ch?' chosen':'')+'"><b>#'+(i+1)+' '+esc(x.title)+'</b>'+pills([x.fit_score+'/10',x.effort,x.format,x.title===ch?'chosen':''])+'<p>'+esc(x.summary)+'</p><p class="m"><b>Why now:</b> '+esc(x.why_now)+'</p>'+(x.hook_idea?'<p class="m"><b>Hook:</b> '+esc(x.hook_idea)+'</p>':'')+((x.risks||[]).length?'<p class="m"><b>Risks:</b> '+esc(x.risks.join('; '))+'</p>':'')+'</div>'}).join('')}
function outPlan(d){var p=d.files.plan;if(!p)return empty('The plan has not been written yet.');
 return'<h3>'+esc(p.title)+'</h3><p>'+esc(p.logline)+'</p>'+

function laneX(id){var i=laneIdx(id);return i<0?-1:60+i*((CW-120)/(LANES.length-1))}
function tokTxt(e){var n=(e.tokens_in||0)+(e.tokens_out||0);return n?(n>=1000?(n/1000).toFixed(1)+'k':n)+' tokens':''}
function msgOf(e){var st=e.stage,w=e.who||st,t=e.text||'';
 switch(e.kind){
  case'start':return{f:'orch',t:st,l:'task'+(e.reads?' · reads '+e.reads:''),c:'task'};
  case'llm_call':return[{f:w,t:'claude',l:'ask Claude'+(e.web?' (web search)':''),c:'llm'},{f:'claude',t:w,l:[tokTxt(e),e.seconds!=null?e.seconds+' s':''].filter(Boolean).join(' · ')||'reply',c:'llm',dash:true}];
  case'comfy_queued':return{f:st,t:'comfy',l:'run '+t,c:'comfy'};
  case'comfy_done':return{f:'comfy',t:st,l:t+' done'+(e.seconds!=null?' · '+e.seconds+' s':''),c:'comfy',dash:true};
  case'output':return{f:st,t:'you',l:'output for review: '+cut(t.replace(/\s+/g,' '),48),c:'out'};
  case'approved':return{f:'you',t:'orch',l:'approved '+st,c:'ok'};

  case'done':return{f:'orch',t:'you',l:'finished',c:'ok'}}
 return null}
function commMsgs(d,o){var out=[];

  var types=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'],mt=types.filter(function(x){return MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x)})[0];
  var r=mt?new MediaRecorder(st,{mimeType:mt}):new MediaRecorder(st);V.rec=r;V.chunks=[];
  r.ondataavailable=function(e){if(e.data&&e.data.size)V.chunks.push(e.data)};
  r.onstop=function(){st.getTracks().forEach(function(t){t.stop()});V.rec=null;micBtn(false);

 var r=new V.web();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;V.rec={stop:function(){r.stop()}};micBtn(true);vstat('Listening (browser speech recognition)…');
 r.onresult=function(e){heard(e.results[0][0].transcript)};r.onerror=function(e){vstat('Speech error: '+e.error)};r.onend=function(){V.rec=null;micBtn(false)};r.start()}
var NUM={one:1,two:2,three:3,four:4,five:5,six:6,first:1,second:2,third:3,fourth:4,to:2,too:2,for:4};
function command(text,p){var t=text.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(),o=p.options||'',m=o.match(/1-(\d+)/),n=m?+m[1]:0;
 if(!t)return null;
 if(/^(save and quit|quit)$/.test(t))return{ans:'q',label:'save and quit'};
 var pk=t.match(/^(?:i ll |i will |let s )?(?:pick |take |choose |go with |use )?(?:the )?(?:option|number|version|image|take|clip)? ?(\d|one|two|three|four|five|six|first|second|third|fourth|to|too|for)(?: one| option| please)?$/);
 if(n&&pk){var k=/\d/.test(pk[1])?+pk[1]:NUM[pk[1]];if(k>=1&&k<=n)return{ans:String(k),label:'Pick #'+k}}
 if(/^(approve|approved|approve it|yes|yes please|ok|okay|looks good|good to go|go ahead|next|perfect|fine|good|accept)$/.test(t)&&p.kind!=='text'&&!n)return{ans:'a',label:'Approve'};
 if(/\[t\]|\bt for\b|t = /.test(o)&&/^(retake|new options|try again|again|regenerate|new seed|new seeds|another one|redo)$/.test(t))return{ans:'t',label:'New options / retake'};
 if(/\bs = /.test(o)&&/^(skip|skip it|no music|no ambience|no voice over|none)$/.test(t))return{ans:'s',label:'Skip'};
 return null}
function heard(text){var p=data&&data.pending;text=(text||'').trim();if(!text){vstat('I did not catch that.');return}
 if(!p){vstat('Heard: "'+text+'", but nothing is waiting for an answer.');return}
 var c=command(text,p);
 if(c&&V.autoSend){vstat('Heard "'+text+'": sending '+c.label);send(c.ans);return}
 if(c){var ta=document.getElementById('ans');if(ta)ta.value='';vstat('Heard "'+text+'" = '+c.label+'. Click the button to send it.');
  var b=document.querySelector('[data-ans="'+c.ans+'"]');if(b){b.style.outline='2px solid var(--am)';b.focus()}else{V.pendingCmd=c.ans;vstat('Heard "'+text+'" = '+c.label+'. Use "Send exactly as typed".');if(ta)ta.value=c.ans}return}
 var ta2=document.getElementById('ans');if(ta2){ta2.value=(ta2.value?ta2.value+' ':'')+text;ta2.focus()}
 vstat('Heard your feedback. Check the text, then send it.')}
function cleanSpeech(t){return String(t||'').replace(/(?:[A-Za-z]:)?[\/\\][^\s]+/g,'').replace(/\b(\d+)x(\d+)\b/g,'$1 by $2').replace(/\[(.)\]/g,'$1').replace(/[|#*_=>]+/g,' ').replace(/\s+/g,' ').trim().slice(0,900)}
function pendingText(p){return cleanSpeech('Waiting for you: '+p.title+'. '+p.summary+'. '+(p.options||''))}
function masterText2(m){return cleanSpeech('Master agent. Understood: '+m.understanding+'. '+(m.verdict==='revisit'?'Decision: go back to '+m.target_stage+'. Root cause: '+m.root_cause+'. '+(m.reasoning||''):'Decision: proceed. '+(m.notes_for_next_stage||'')))}
function speak(text){if(!text)return;if(V.audio){V.audio.pause();V.audio=null}if(window.speechSynthesis)speechSynthesis.cancel();
 var fallback=function(){if(!window.speechSynthesis){vstat('No speech output available.');return}var u=new SpeechSynthesisUtterance(text);u.lang='en-US';speechSynthesis.speak(u)};
 if(!V.tts)return fallback();vstat('Preparing speech…');
 fetch(q('/api/speak'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})}).then(function(r){if(!r.ok)throw 0;return r.blob()})
  .then(function(b){vstat('');var a=new Audio(URL.createObjectURL(b));V.audio=a;a.play().catch(function(){vstat('Click Listen to play (the browser blocked autoplay).')})}).catch(function(){vstat('');fallback()})}
function autoRead(d){var a=document.getElementById('vAuto');if(!a||!a.checked||!d.pending)return;if(V.lastRead===d.pending.id)return;V.lastRead=d.pending.id;speak(pendingText(d.pending))}
/* ---------------- page wiring ---------------- */
var data=null,proj=null,sel=null,tab='output',el={};
function curStage(){if(sel)return sel;var c=(data.state.current||{}).stage;if(c)return c;var ap=data.state.approved||{};for(var i=0;i<ST.length;i++)if(ST[i].id!=='final'&&!ap[ST[i].id])return ST[i].id;return'final'}
function setHTML(e,h){if(e&&e._h!==h){e.innerHTML=h;e._h=h}}
var view='flow',selMsg=null;
function renderComm(){var msgs=commMsgs(data,comm);
 setHTML(el.cstats,(data.pending?'<div class="card amber" style="grid-column:1/-1;margin:0"><b>Waiting for you: '+esc(data.pending.title)+'</b> <button data-view="flow" style="margin-left:10px">Answer in the Flow view</button></div>':'')+renderCommStats(data));setHTML(el.chead,renderCommHead(data));
 var sc=el.cscroll,stick=commStick||sc.scrollHeight-sc.scrollTop-sc.clientHeight<60;
 var keep=sc.scrollTop;setHTML(el.cbody,renderCommBody(data,msgs,selMsg));if(stick){sc.scrollTop=sc.scrollHeight;commStick=false}else sc.scrollTop=keep
 setHTML(el.cdetail,renderCommDetail(data,selMsg));
 el.cinfo.textContent=msgs.length+' of '+msgs.total+' messages shown'}
function render(){if(!data)return;var s=curStage(),h=headline(data),c=data.state.current||{};
 el.mainview.style.display=view==='flow'?'':'none';el.commview.style.display=view==='comm'?'':'none';
 el.vFlow.className=view==='flow'?'on':'';el.vComm.className=view==='comm'?'on':'';
 el.chip.className='chip '+h.k;el.chip.textContent=h.t+(c.time&&h.k==='active'?'  ('+ago(data.now-c.time)+')':'');
 el.meta.textContent=data.run.alive?'studio running (pid '+data.run.pid+')':'';
 if(view==='comm'){renderComm();return}
 setHTML(el.flow,renderFlow(data,s));setHTML(el.review,renderReview(data));setHTML(el.head,renderHead(data,s));setHTML(el.tabs,renderTabs(tab));
 var con=document.getElementById('con'),stick=con&&(con.scrollHeight-con.scrollTop-con.clientHeight<40);
 setHTML(el.body,renderTab(data,s,tab));
 if(tab==='console'){var c2=document.getElementById('con');if(c2&&(stick||con==null))c2.scrollTop=c2.scrollHeight}
 }
function load(){if(!proj)return;fetch(q('/api/project?name='+encodeURIComponent(proj))).then(function(r){return r.json()}).then(function(d){if(d.error)throw 0;data=d;render();autoRead(d)}).catch(function(){el.chip.className='chip stopped';el.chip.textContent='Dashboard cannot reach the studio'})}
function send(text){var p=data&&data.pending;if(!p)return;fetch(q('/api/answer'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project:proj,id:p.id,text:text})}).then(function(r){if(!r.ok)alert('That question was already answered or closed.');else{el.review.innerHTML='<div class="card"><div class="ct">Sent: waiting for the studio…</div></div>';el.review._h=null;setTimeout(load,700)}})}
function onClick(e){var t=e.target.closest('[data-mic],[data-speak],[data-autosend],[data-ans],[data-send],[data-tab],[data-follow],[data-allfb],[data-stage],[data-view],[data-msg]');if(!t)return;
 if(t.dataset.mic!==undefined){micToggle();return}
 if(t.dataset.autosend!==undefined){V.autoSend=t.checked;return}
 if(t.dataset.speak){if(t.dataset.speak==='master'){var m=data.masters[t.dataset.stageId==='final'?'audio':t.dataset.stageId];if(m)speak(masterText2(m))}else if(data.pending)speak(pendingText(data.pending));return}
 if(t.dataset.view){view=t.dataset.view;if(view==='comm')commStick=true;render();return}
 if(t.dataset.msg!==undefined){selMsg=+t.dataset.msg;render();return}
 if(t.dataset.ans!==undefined){send(t.dataset.ans);return}
 if(t.dataset.send){var v=(document.getElementById('ans').value||'').trim(),p=data.pending;if(!v){alert('Type something first.');return}
  send(t.dataset.send==='raw'||p.kind==='text'||p.kind==='review'?v:'r '+v);return}
 if(t.dataset.follow){sel=null;render();return}
 if(t.dataset.allfb!==undefined){allFb=t.checked;render();return}
 if(t.dataset.tab){tab=t.dataset.tab;if(t.dataset.stage&&t.dataset.stage!==''&&t.tagName!=='BUTTON')sel=t.dataset.stage;render();return}
 if(t.dataset.stage){sel=t.dataset.stage;tab='output';render()}}
function init(){initVoice();['flow','review','head','tabs','body','chip','meta','proj','mainview','commview','vFlow','vComm','cstats','chead','cscroll','cbody','cdetail','cinfo','fLlm','fComfy','fLane','fAll'].forEach(function(i){el[i]=document.getElementById(i)});
 document.addEventListener('click',onClick);
 el.fLane.innerHTML='<option value="all">everyone</option>'+LANES.map(function(l){return'<option value="'+l.id+'">'+esc(l.n)+'</option>'}).join('');
 el.fLlm.onchange=function(){comm.llm=el.fLlm.checked;commStick=true;render()};el.fComfy.onchange=function(){comm.comfy=el.fComfy.checked;commStick=true;render()};
 el.fLane.onchange=function(){comm.lane=el.fLane.value;commStick=true;render()};el.fAll.onchange=function(){comm.all=el.fAll.checked;commStick=true;render()};
 var pick=function(){fetch(q('/api/projects')).then(function(r){return r.json()}).then(function(r){el.proj.innerHTML=r.projects.map(function(n){return'<option>'+esc(n)+'</option>'}).join('');var want=new URLSearchParams(location.search).get('project')||proj||r.default;if(want)el.proj.value=want;proj=el.proj.value;load()})};
 el.proj.onchange=function(){proj=el.proj.value;sel=null;load()};pick();setInterval(load,2000);setInterval(pick,15000)}
if(typeof document!=='undefined'&&document.getElementById('flow'))init();
</script></body></html>
